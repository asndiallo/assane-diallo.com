name: CI

on:
  push:
    branches: [develop]
  pull_request:
  # Deploys call this workflow so they ship exactly the build that passed these checks.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a deploy never cancels a plain CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public, non-secret build settings live in repo Variables (Settings → Secrets and variables → Actions).
env:
  PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
  PUBLIC_ANALYTICS: ${{ vars.PUBLIC_ANALYTICS }}
  PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}

jobs:
  # Lint, typecheck, build, Playwright, link check. Uploads the tested dist/ for the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build (lists remaining [TODO] markers as warnings)
        run: pnpm build

      # No --with-deps: the runner image already has Chrome's system libraries, and the apt
      # mirror can crawl (12 min for 20 MB once), which timed the whole job out.
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Smoke test
        run: pnpm test:e2e
      - name: Link check
        run: pnpm linkcheck

      - name: Upload the tested build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 3

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Every page × 3 runs takes ~16 min and grows with each page, so it runs beside `test`
  # with its own build (a few seconds) instead of after it.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Lighthouse CI
        run: pnpm lhci
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # The required status check in the develop ruleset: passes only when every job above passed.
  check:
    needs: [test, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All checks passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.lighthouse.result }}" = success
